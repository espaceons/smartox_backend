<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SmartMed IoT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div class="card card-login shadow-lg border-0 p-4 bg-white">
    <div class="text-center mb-4">
        <div class="bg-primary text-white d-inline-block rounded-circle p-3 mb-2">
            <i class="bi bi-capsule fs-1"></i>
        </div>
        <h3 class="fw-bold text-dark">SmartMed IoT</h3>
        <p class="text-muted small">Connectez-vous à votre espace professionnel ou famille</p>
    </div>

    {% if form.errors %}
        <div class="alert alert-danger alert-dismissible fade show small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Identifiants incorrects.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label text-secondary fw-semibold">Nom d'utilisateur</label>

            {{ form.username }}
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary fw-semibold">Mot de passe</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i> Se connecter
        </button>
    </form>
    
    <div class="text-center mt-3">
        <a href="{% url 'home' %}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i> Retour à la page de présentation
        </a>
    </div>
</div>

</body>
</html>
